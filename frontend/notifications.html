<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications · SkillSwap</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="notifications">
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <main class="main">
      <div id="topbar-slot"></div>

      <div class="page-head">
        <div>
          <h1>Notifications</h1>
          <p>Stay up to date with your activity</p>
        </div>
        <button class="btn btn-outline" onclick="markAllRead()">Mark all as read</button>
      </div>

      <div class="card" style="padding:0;">
        <div id="notif-list"><div class="loading">Loading notifications...</div></div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/layout.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/socket-client.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
